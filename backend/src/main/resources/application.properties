# ===================================================================
# Prince Study Material Portal - Spring Boot Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (H2 file-based persistence for out-of-the-box zero-setup execution)
# Data persists in the './data/material_portal' directory across restarts.
spring.datasource.url=jdbc:h2:file:./data/material_portal;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Init (Disabled in favor of automated JPA + DataInitializer)
spring.sql.init.mode=never

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Settings
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Swagger / OpenAPI Settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
